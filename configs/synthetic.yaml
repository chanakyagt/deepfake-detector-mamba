model:
  d_model: 256
  n_layers: 2
  d_state: 16
  dropout: 0.1
  temporal: true
train:
  mode: diloco
  seed: 0
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 0.01
  total_steps: 1000
  inner_steps: 100
  outer_lr: 0.7
  outer_momentum: 0.9
  comm_dtype: bfloat16
  eval_every_syncs: 1
  log_every: 100
